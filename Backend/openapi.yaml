      security: [{ staffAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: [string, 'null'] }
                price_paise: { type: integer, minimum: 0 }
                default_minutes: { type: integer, minimum: 1, maximum: 600 }
                sort_order: { type: integer }
                is_active: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [service]
                properties:
                  service: { $ref: '#/components/schemas/ServiceAdmin' }
