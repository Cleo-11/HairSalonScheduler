  /v1/dashboard/{slug}/hours:
    parameters: [{ $ref: '#/components/parameters/Slug' }]
    get:
      tags: [Dashboard settings]
      operationId: getHours
      security: [{ staffAuth: [] }]
      responses:
        '200':
          description: Weekly hours and upcoming holidays
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [timezone, hours, holidays]
                properties:
                  timezone: { type: string }
                  hours: { type: array, items: { $ref: '#/components/schemas/HoursInterval' } }
                  holidays:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [date, note]
                      properties:
                        date: { type: string, format: date }
                        note: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Dashboard settings]
      operationId: setHours
      summary: Replace the weekly schedule (owner)
      description: Several intervals on the same weekday model a midday break (e.g. 10:00-14:00 and 15:00-21:00). A day with no intervals is closed.
      security: [{ staffAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hours]
              properties:
                hours: { type: array, items: { $ref: '#/components/schemas/HoursInterval' } }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [hours]
                properties:
                  hours: { type: array, items: { $ref: '#/components/schemas/HoursInterval' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

