# Local Postgres with PostGIS. `docker compose up -d`, then `npm run db:migrate && npm run db:seed`.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon
      POSTGRES_DB: salon_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
volumes:
  pgdata:
