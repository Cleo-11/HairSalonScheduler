# Render Blueprint: creates the database and the API from this one file.
# Render dashboard -> New -> Blueprint -> pick this GitHub repo.
databases:
  - name: kataar-db
    plan: free # free databases are deleted 30 days after creation; upgrade to keep the data
    region: singapore # must match the API's region, or the API cannot reach the database
    databaseName: kataar
    user: kataar
    postgresMajorVersion: "16"

services:
  - type: web
    name: kataar-api
    runtime: node
    plan: free # sleeps after 15 min without traffic; the first request afterwards takes about a minute
    region: singapore # closest Render region to India
    rootDir: Backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod # applies database migrations, then starts the API
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kataar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_HMAC_SECRET
        generateValue: true
      # Demo hosting without WhatsApp: sign-in codes are shown on the page, the demo salon is
      # created on first start. Anyone can sign in as any phone number. Remove DEMO_MODE (and
      # set a real provider) before real customers use it.
      - key: DEMO_MODE
        value: "true"
      - key: OTP_PROVIDER
        value: dev
      - key: NOTIFY_PROVIDER
        value: dev
      - key: SEED_STAFF_PASSWORD
        sync: false # Render asks for this when you create the Blueprint: the password for the demo staff logins
      # "*" lets any website call the API (fine for a demo: sign-in uses tokens, not cookies).
      # After the website is on Vercel, change it to its address, e.g. https://kataar.vercel.app
      - key: CORS_ORIGINS
        value: "*"
